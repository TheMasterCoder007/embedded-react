version: "0.19.0"
description: "embedded-react Flow B runtime: checks a compiled package and runs it, with no QuickJS and no heap. Brings in the embedded-react engine at the same version."
url: "https://github.com/TheMasterCoder007/embedded-react"
repository: "https://github.com/TheMasterCoder007/embedded-react.git"
documentation: "https://embedded-react.dev/internals/flow-b-packages"
issues: "https://github.com/TheMasterCoder007/embedded-react/issues"
targets:
  - esp32
  - esp32s3
  - esp32p4
dependencies:
  idf:
    version: ">=5.0"
  TheMasterCoder007/embedded-react:
    version: "0.19.0"
    require: public
files:
  exclude:
    - "tests/**/*"
    - "build/**/*"
    - "cmake-build-*/**/*"
