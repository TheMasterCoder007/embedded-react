<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="glass">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
    <clipPath id="top" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="0.5"/>
    </clipPath>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <mask id="deep">
      <rect x="0" y="0" width="100" height="100" fill="url(#depth)"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#203040"/>
  <g clip-path="url(#glass)">
    <rect x="0" y="0" width="100" height="45" fill="#80c0f0"/>
    <g mask="url(#deep)">
      <rect x="0" y="45" width="100" height="55" fill="#2060c0"/>
      <path d="M0 60 Q25 50 50 60 T100 60 V70 Q75 60 50 70 T0 70 Z" fill="#ffffff"/>
    </g>
    <circle cx="70" cy="28" r="12" fill="#ffd040" clip-path="url(#top)"/>
  </g>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#c0a060" stroke-width="6"/>
</svg>
