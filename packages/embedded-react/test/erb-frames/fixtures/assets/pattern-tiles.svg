<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="bricks" width="0.25" height="0.2" viewBox="0 0 10 8">
      <rect x="0.5" y="0.5" width="9" height="3" fill="#b05030"/>
      <rect x="-4.5" y="4.5" width="9" height="3" fill="#c06040"/>
      <rect x="5.5" y="4.5" width="9" height="3" fill="#c06040"/>
    </pattern>
    <pattern id="plus" width="14" height="14" patternUnits="userSpaceOnUse" overflow="visible">
      <path d="M-3 0 H3 M0 -3 V3" stroke="#208050" stroke-width="2"/>
