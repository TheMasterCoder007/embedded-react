# CI — runs on every PR + push to master. Fast, display-free checks (the parity harness opens real SDL
# windows, so it stays a dev-machine check, not CI). Three independent jobs:
#   js      — the npm package: 210+ vitest unit tests + the version/LICENSE/NOTICE drift gate.
#   engine  — the C99 engine: configure, build, and run the host ctests (no MCU, no SDL).
#   bridge  — the QuickJS bridge: build against the pinned QuickJS + the JS heap-accounting/GC test,
#             in both the native and the bare-metal allocator configurations.
#   aot     — compile a demo to C with the Flow B AOT, then gcc the generated C against the engine headers
#             (verifies the output compiles + the embedded-react version-pin _Static_assert holds).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: JS tests + version drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/quickjs/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridges/quickjs/js/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - name: Version + LICENSE/NOTICE in sync with VERSION
        run: node ../../../tools/sync-version.mjs --check

  engine:
    name: Engine build + ctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B engine/build-ci
      - name: Build
        run: cmake --build engine/build-ci
      - name: Test
        run: ctest --test-dir engine/build-ci --output-on-failure
      # Second pass with the gradient features enabled (as the simulators ship them). The gradient
      # assertions in tests/rendering/test_vector.c are wrapped in #if ERUI_GRADIENT* and compile out of
      # the lean default build above, so the gradient render path is ONLY exercised here. Guards against
      # regressions like the resolve_grad early-return that made every vector gradient transparent.
      - name: Configure (gradients enabled)
        run: >
          cmake -S engine -B engine/build-ci-grad
          -DERUI_GRADIENT=ON -DERUI_GRADIENT_RADIAL=ON -DERUI_GRADIENT_CONIC=ON
      - name: Build (gradients enabled)
        run: cmake --build engine/build-ci-grad
      - name: Test (gradients enabled)
        run: ctest --test-dir engine/build-ci-grad --output-on-failure
      # Third pass with two render workers. The multi-worker code (hook-backed worker ids, the
      # pthread fork-join in tests/rendering/test_parallel.c, per-worker context isolation) compiles
      # out of the default single-worker build above, so it is ONLY exercised here — without this
      # pass it would rot unbuilt, like any off-by-default config. ERUI_PERF_STATS rides along for
      # the same reason: the frame instrumentation (er_perf.h, including the per-worker blit
      # accounting) compiles to stubs in the default build, so tests/rendering/test_perf.c only
      # exercises the real thing here.
      - name: Configure (2 render workers)
        run: >
          cmake -S engine -B engine/build-ci-mt
          -DERUI_RENDER_WORKERS=2 -DERUI_TRANSFORMS=FULL -DERUI_PERF_STATS=ON
      - name: Build (2 render workers)
        run: cmake --build engine/build-ci-mt
      - name: Test (2 render workers)
        run: ctest --test-dir engine/build-ci-mt --output-on-failure
      # Fourth pass with occlusion culling compiled out. tests/rendering/test_occlusion.c guards its
      # "this layer WAS skipped" assertions on ERUI_OCCLUSION_CULLING and leaves every "must still
      # paint" and "must look identical" check unguarded — but the flag defaults ON, so without this
      # pass the fallback build is never actually compiled and the guards protect nothing.
      - name: Configure (occlusion culling off)
        run: cmake -S engine -B engine/build-ci-noocc -DERUI_OCCLUSION_CULLING=OFF
      - name: Build (occlusion culling off)
        run: cmake --build engine/build-ci-noocc
      - name: Test (occlusion culling off)
        run: ctest --test-dir engine/build-ci-noocc --output-on-failure
      # Fifth pass with rotateX/rotateY/perspective. ERUI_3D_TRANSFORMS is OFF by default and was off in
      # every pass above, so the whole 3D path — the homography + projected AABB in transform.c, the 3D
      # branches of the damage pre-pass and hit-testing — were never compiled, and the scenarios guarding
      # it in tests/rendering/test_transform.c and test_transform_damage.c never ran. It implies
      # ERUI_TRANSFORMS=FULL (the 3D code lives inside the affine path).
      - name: Configure (3D transforms)
        run: cmake -S engine -B engine/build-ci-3d -DERUI_TRANSFORMS=FULL -DERUI_3D_TRANSFORMS=ON
      - name: Build (3D transforms)
        run: cmake --build engine/build-ci-3d
      - name: Test (3D transforms)
        run: ctest --test-dir engine/build-ci-3d --output-on-failure
      # Sixth pass with shadows, and with the transform source deliberately SMALLER than the composite
      # scratch. Two reasons for the pairing:
      #   - ERUI_SHADOWS is OFF by default, so the shadow rasteriser has never been compiled here at all
      #     and roughly half of tests/rendering/test_shadow.c sits behind #if ERUI_SHADOWS unbuilt — as
      #     does the whole of tests/rendering/test_shadow_retire_damage.c, which is the only cover for a
      #     shadow being erased when its node is removed, hidden or simply stops casting one.
      #   - ERUI_XFORM_W/H exists to be decoupled from ERUI_SCRATCH_W/H, and only the decoupled build has
      #     a size band where a node is too big for a transform capture (so it paints untransformed) yet
      #     small enough to still cast a shadow. tests/rendering/test_transform_shadow_damage.c compiles
      #     to a SKIP without that band, so this pass is the one that gives it teeth (and the same band
      #     unlocks test_shadow_retire_damage.c's transform-fallback half).
      - name: Configure (shadows, decoupled transform scratch)
        run: >
          cmake -S engine -B engine/build-ci-shadow
          -DERUI_TRANSFORMS=FULL -DERUI_SHADOWS=ON -DERUI_XFORM_W=120 -DERUI_XFORM_H=120
      - name: Build (shadows, decoupled transform scratch)
        run: cmake --build engine/build-ci-shadow
      - name: Test (shadows, decoupled transform scratch)
        run: ctest --test-dir engine/build-ci-shadow --output-on-failure

  bridge:
    name: QuickJS bridge build + heap-accounting test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the bridge against the pinned QuickJS (FetchContent) and runs the smoke + heap-accounting
      # tests. The heap test guards the GC trigger itself: QuickJS collects only when
      # js_malloc_usable_size() says enough bytes are live, and an allocator that answers 0 (QuickJS's own
      # default off Apple/Win32/glibc — i.e. bare metal and Emscripten) silently disables the collector
      # AND memory_limit. The runner is glibc, so the platform-specific bug can't reproduce here directly;
      # the test injects a zero-returning allocator to reproduce the mechanism instead.
      - name: Configure
        run: cmake -S bridges/quickjs -B bridges/quickjs/build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build bridges/quickjs/build-ci -j
      - name: Test
        run: ctest --test-dir bridges/quickjs/build-ci --output-on-failure
      - name: Smoke
        run: ./bridges/quickjs/build-ci/er-bridge-quickjs-smoke
      # Second pass forcing the bare-metal allocator. It is selected by platform, so on a Linux runner
      # the shim path would otherwise never be compiled or run — exactly the kind of off-by-default code
      # that rots unbuilt (and it is the path that ships to MCUs).
      - name: Configure (bare-metal size-prefix allocator)
        run: >
          cmake -S bridges/quickjs -B bridges/quickjs/build-ci-shim
          -DCMAKE_BUILD_TYPE=Release -DER_BRIDGE_JS_USABLE_SIZE=shim
      - name: Build (bare-metal size-prefix allocator)
        run: cmake --build bridges/quickjs/build-ci-shim -j
      - name: Test (bare-metal size-prefix allocator)
        run: ctest --test-dir bridges/quickjs/build-ci-shim --output-on-failure

  aot:
    name: AOT compile smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/quickjs/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridges/quickjs/js/package-lock.json
      - run: npm ci
      # gcc the generated C against the public engine headers — no SDL, no display. -fsyntax-only still
      # evaluates the version-pin _Static_assert, so an ABI/version mismatch fails here.
      - name: watch-face → C → gcc
        run: |
          ER_AOT_SCREEN_W=240 ER_AOT_SCREEN_H=280 node aot/compile.mjs watch-face
          gcc -std=c99 -fsyntax-only -I ../../../engine/include -I dist dist/app.gen.c
          gcc -std=c99 -fsyntax-only -I ../../../engine/include -I dist dist/assets.generated.c
      - name: thermostat (solo) → C → gcc
        run: |
          ER_AOT_SCREEN_W=320 ER_AOT_SCREEN_H=480 node aot/compile.mjs thermostat
          gcc -std=c99 -fsyntax-only -I ../../../engine/include -I dist dist/app.gen.c
          gcc -std=c99 -fsyntax-only -I ../../../engine/include -I dist dist/assets.generated.c

  consumer:
    name: Consumer smoke (pack + install + build)
    # Exercises the PACKAGED + INSTALLED flow that unit tests can't reach: npm pack → install into a
    # throwaway app → `embedded-react build` (Flow A app.erpkg, via the wasm bytecode compiler) and
    # `--aot` (Flow B app.gen.c). Catches files-whitelist gaps, ESM/CJS resolution, and the bytecode
    # path. Builds the wasm (emsdk) so the Flow A leg runs — the only way to cover it on a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.13
      - name: Build the prebuilt WASM simulator
        run: node tools/web-sim/build.mjs
      - name: Pack → install → build (Flow A + AOT)
        run: node tools/consumer-smoke.mjs
